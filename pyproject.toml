[project]
name = "clean-python"
version = "0.1.0"
description = "Sam Keen's \"Clean Architecture with Python\" todo app"
readme = "README.md"
authors = [
    {
        name = "Derick Downey",
        email = "126332037+derickdowney@users.noreply.github.com"
    }
]
requires-python = ">=3.15"
dependencies = [
    "pytest>=9.2.0",
]

[project.scripts]
clean-python = "clean_python:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
